<style>@import url('_base.css');
  /* Photo bleeds off the bottom and fades into the ground at its top edge —
     the CI asks for slides to "blend into the artwork around them" rather than
     sit in a bordered card. */
  .photo{position:absolute;left:0;right:0;bottom:0;height:1560px}
  .photo img{width:1284px;height:1560px;object-fit:cover;display:block}
  .photo::after{content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,#141414 0%,rgba(20,20,20,.55) 14%,rgba(20,20,20,0) 34%,
                               rgba(34,34,34,0) 58%,rgba(30,30,30,.45) 74%,rgba(28,28,28,.82) 87%,rgba(26,26,26,.97) 95%,#222 100%)}
  .type{position:absolute;left:110px;right:110px;top:200px;z-index:2}
  .head{font-size:168px;line-height:1.0;font-weight:500;letter-spacing:-.032em}
  .sub{margin-top:44px;font-size:86px;line-height:1.1;font-weight:500;
       letter-spacing:-.01em;color:var(--amber)}
  .note{margin-top:40px;font-size:64px;line-height:1.32;font-weight:300;
        color:var(--ink-muted);max-width:960px}
  /* Attribution, not endorsement — the CI bans generator names as endorsement,
     and the generator behind this still is unverified, so it stays unnamed. */
  .credit{margin-top:46px;font-family:'Space Mono',monospace;font-size:38px;
          color:var(--ink-faint);letter-spacing:.02em}
</style>
<div class="shot">
  <div class="photo"><img src="cover-photo.png" alt=""></div>
  <div class="type">
    <div class="head">Write<br>better<br>prompts.</div>
    <div class="sub">Fewer wasted credits.</div>
    <div class="note">The app writes the prompt so it lands more often.</div>
    <div class="credit">Image generated from a prompt written in this app.</div>
  </div>
  <div class="foot"><img src="app-icon.png" alt=""><span class="wordmark">Cinematic Prompts</span></div>
</div>
